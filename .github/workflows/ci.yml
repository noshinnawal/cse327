name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite

      - name: Lint PHP files
        run: |
          mapfile -t files < <(find . -name '*.php' -not -path './.git/*')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PHP files found"
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file" > /dev/null || { echo "Syntax error in $file"; exit 1; }
          done
          echo "All PHP files lint clean"

      - name: Run test suite
        run: php tests/run.php
